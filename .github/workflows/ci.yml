name: CI
on: { pull_request: { } }
concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  setup-build:
    uses: infrabits/ci-setup-tox-env/.github/workflows/setup.yml@4f1b39f5c566f6a387aea8ed2c57402dc122b233 # v1.10.0

  execute-lint:
    needs: [setup-build]
    uses: infrabits/ci-run-tox-env/.github/workflows/run.yml@78d52c3c24baa2c85eb416ebbc0917efb42c454f # v1.6.0
    with:
      environments: ${{ needs.setup-build.outputs.lint }}

  create-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: infrabits/ci-setup-python@e2b1af9cbd4f0cf31736b5ae234471b61aa41220 # v1.8.0
        with:
          install_dependencies: true
          install_test_dependencies: false
          install_tox: false

      - run: poetry run ./scripts/create-package.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-artifacts
          retention-days: 7
          path: drag-and-drop.apkg
