name: CI
on: { pull_request: { } }
concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  setup-build:
    uses: infrabits/ci-setup-tox-env/.github/workflows/setup.yml@b2d4f67c809423d364e800630fa6919868e903f5 # v1.8.0

  execute-lint:
    needs: [setup-build]
    uses: infrabits/ci-run-tox-env/.github/workflows/run.yml@37fc7f6fd3377207ade86db0056d1a826f61e278 # v1.4.0
    with:
      environments: ${{ needs.setup-build.outputs.lint }}

  create-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: infrabits/ci-setup-python@0a2dd968401b001362997490a977f0177a600232 # v1.6.0
        with:
          install_dependencies: true
          install_test_dependencies: false
          install_tox: false

      - run: poetry run ./scripts/create-package.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-artifacts
          retention-days: 7
          path: drag-and-drop.apkg
